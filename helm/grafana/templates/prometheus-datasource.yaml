apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: "1"    
data:
  prometheus-datasource.yaml: |-
    apiVersion: 1
    datasources:
     - name: prometheus
       type: prometheus
       url: http://prometheus-server.monitoring.svc.cluster.local
       access: proxy
       isDefault: false
