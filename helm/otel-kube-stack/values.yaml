opentelemetry-kube-stack:
  crds:
    installPrometheus: false

  opentelemetry-operator:
    admissionWebhooks:
      certManager:
        issuerRef:
          kind: ClusterIssuer
          name: nscubed-cluster-issuer

  collectors:
    daemon:
      enabled: false  
    stateful-nscubed:
      suffix: ss-ta
      mode: statefulset
      enabled: true
      resources:
        limits:
          # cpu: 200m
          memory: 500Mi
        requests:
          cpu: 100m
          memory: 250Mi 
      presets:
        logsCollection:
          enabled: false
        kubeletMetrics:
          enabled: false
        hostMetrics:
          enabled: false
        kubernetesAttributes:
          enabled: true
          extractAllPodLabels: true
          extractAllPodAnnotations: true          
        kubernetesEvents:
          enabled: true
        clusterMetrics:
          enabled: true
        annotationDiscovery:
          logs:
            enabled: false
          metrics:
            enabled: false     
      targetAllocator:
        enabled: true
        serviceAccount: otel-ss-ta-sa
        prometheusCR:
          enabled: true
          podMonitorSelector: {}
          serviceMonitorSelector: {}   
      config:
        receivers:
          prometheus:
            config:
              scrape_configs:
              - job_name: 'otel-collector'
                scrape_interval: 10s
                static_configs:
                - targets: [ '0.0.0.0:8888' ] 
        processors:
          resource/set_service_name:
              attributes:
                - key: service.name
                  value: "integrations/kubernetes/eventhandler"
                  action: insert
          resourcedetection/env:
            detectors: [env, k8snode]
            timeout: 2s
            override: false
          resource/hostname:
            attributes:
              - key: host.name
                from_attribute: k8s.node.name
                action: insert
          batch:
            send_batch_size: 1000
            timeout: 1s
            send_batch_max_size: 1500
        exporters:  
          otlphttp/logs:
            endpoint: http://loki-gateway.monitoring.svc.cluster.local:80/otlp
            tls:
              insecure: true        
          otlphttp/metrics:
            endpoint: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/otlp
            tls:
              insecure: true      
        service:
          pipelines:
            metrics:
              receivers:
              - prometheus
              processors:
              - resourcedetection/env
              - resource/hostname
              - batch
              exporters:
              - otlphttp/metrics
            logs:
              receivers:
              processors:
              - resource/set_service_name
              - resourcedetection/env
              - resource/hostname
              - batch
              exporters:
              - otlphttp/logs              
    daemon-nscubed:
      suffix: daemon
      mode: daemonset
      enabled: true
      resources:
        limits:
          # cpu: 200m
          memory: 500Mi
        requests:
          cpu: 100m
          memory: 250Mi
      scrape_configs_file: "daemon_scrape_configs.yaml"    
      presets:
        logsCollection:
          enabled: true
        kubeletMetrics:
          enabled: true
        hostMetrics:
          enabled: true
        kubernetesAttributes:
          enabled: true
          extractAllPodLabels: true
          extractAllPodAnnotations: true 
        kubernetesEvents:
          enabled: false
        clusterMetrics:
          enabled: false
        annotationDiscovery:
          logs:
            enabled: false
          metrics:
            enabled: false     
      config:
        receivers:
          prometheus:
            config:
              scrape_configs:
              - job_name: 'otel-collector'
                scrape_interval: 10s
                static_configs:
                - targets: [ '0.0.0.0:8888' ] 
        processors:
          resourcedetection/env:
            detectors: [env, k8snode]
            timeout: 2s
            override: false
          resource/hostname:
            attributes:
              - key: host.name
                from_attribute: k8s.node.name
                action: insert
          batch:
            send_batch_size: 1000
            timeout: 1s
            send_batch_max_size: 1500
        exporters:   
          otlphttp/logs:
            endpoint: http://loki-gateway.monitoring.svc.cluster.local:80/otlp
            tls:
              insecure: true     
          otlphttp/metrics:
            endpoint: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/otlp
            tls:
              insecure: true      
        service:
          pipelines:
            metrics:
              receivers:
              - prometheus
              processors:
              - resourcedetection/env
              - resource/hostname
              - batch
              exporters:
              - otlphttp/metrics
            logs:
              receivers:
              processors:
              - resourcedetection/env
              - resource/hostname
              - batch
              exporters:
              - otlphttp/logs

  kubeStateMetrics:
    enabled: true

  kube-state-metrics:
    metricLabelsAllowlist:
      - nodes=[*]

  nodeExporter:
    enabled: true

  kubernetesServiceMonitors:
    enabled: true
    ignoreNamespaceSelectors: true

  kubeApiServer:
    enabled: true
    tlsConfig:
      insecureSkipVerify: true

  kubelet:
    enabled: true      

  kubeControllerManager:
    enabled: true

  coreDns:
    enabled: true

  kubeEtcd:
    enabled: true

  kubeScheduler:
    enabled: true

  kubeProxy:
    enabled: true
