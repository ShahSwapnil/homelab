apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: targetallocator-http-route
spec:
  hostnames:
  - "targetallocator.nscubed.lan"

  parentRefs:
  - name: nscubed-tls-gateway
    namespace: default

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: otel-kube-stack-ss-ta-targetallocator
      port: 80
