apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-http-route
spec:
  hostnames:
  - "prometheus.nscubed.lan"

  parentRefs:
  - name: nscubed-tls-gateway
    namespace: default

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: prometheus-server
      port: 80
