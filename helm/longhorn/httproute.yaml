apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-route
  namespace: longhorn-system
spec:
  hostnames:
  - "longhorn.nscubed.lan"

  parentRefs:
  - name: nscubed-tls-gateway
    namespace: default

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: longhorn-frontend
      port: 80
