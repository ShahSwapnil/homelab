configmapReload:
  prometheus:
    enabled: false # Since Prometheus is not going to be scraping - configuration does not need to reloaded

server:
  namespaces:
    - random # We don't want prometheus to find anything to do. 

  extraFlags:
    - web.enable-lifecycle
    - web.enable-otlp-receiver

  tsdb:
    out_of_order_time_window: 30m

  topologySpreadConstraints:
    - topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule 
      maxSkew: 1

  otlp:
    promote_resource_attributes:
      - service.instance.id
      - service.name
      - service.namespace
      - service.version
      - cloud.availability_zone
      - cloud.region
      - container.name
      - deployment.environment
      - deployment.environment.name
      - k8s.cluster.name
      - k8s.container.name
      - k8s.cronjob.name
      - k8s.daemonset.name
      - k8s.deployment.name
      - k8s.job.name
      - k8s.namespace.name
      - k8s.pod.name
      - k8s.replicaset.name
      - k8s.statefulset.name
    keep_identifying_resource_attributes: true

  statefulSet:
    enabled: false

serverFiles:
  prometheus.yml: 
    rule_files: []
    scrape_configs: []

alertmanager:
  enabled: false
