  #   periodSeconds: 5
  #   timeoutSeconds: 2
  #   failureThreshold: 5

  # Observability configuration for the collector
  observability: {}
  #   metrics:
  #     enableMetrics: true

  # Update strategy for the collector
  updateStrategy: {}
  #   type: RollingUpdate

