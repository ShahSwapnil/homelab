      # Config maps for the collector
      configmaps: []
      # - name: config
      #   mountPath: /etc/config

  deployment:
    - name: otel-deployment
      enabled: false
      managementState: managed
      mode: deployment

      annotations: {}

      labels: {}

      # Configuration for cluster role binding
      clusterRoleBinding:
        enabled: true
        clusterRoleName: ""
