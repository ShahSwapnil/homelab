apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel.collector.clusterRole" . }}
rules:
- apiGroups: [""]
  resources:
  - endpoints
  - events
  - namespaces
  - namespaces/status
  - nodes
  - nodes/proxy
  - nodes/metrics
  - nodes/spec
  - nodes/stats
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - pods/status
  - replicationcontrollers
  - replicationcontrollers/status
  - resourcequotas
  - services
  - secrets
  verbs: ["get", "list", "watch"]

- apiGroups: ["monitoring.coreos.com"]
  resources:
  - servicemonitors
  - podmonitors
  - scrapeconfigs
  - probes
  verbs: ["get", "list", "watch"]

- apiGroups: ["extensions"]
  resources:
  - ingresses
  - daemonsets
  - deployments
  - replicasets
  verbs: ["get", "list", "watch"]

- apiGroups: ["apps"]
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs: ["get", "list", "watch"]

- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]

- apiGroups: ["discovery.k8s.io"]
  resources:
  - endpointslices
  verbs: ["get", "list", "watch"]

- nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
  verbs: ["get"]

- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["watch", "list"]

- apiGroups: ["autoscaling"]
  resources:
    - horizontalpodautoscalers
  verbs: ["get", "list", "watch"]

- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs: ["get", "list", "watch"]
    
- apiGroups: ["coordination.k8s.io"]
  resources:
  - leases
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]



