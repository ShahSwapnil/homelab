apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-http-route
  namespace: harbor # The namespace where your application service is located
spec:
  parentRefs:
  - name: http-gateway
    namespace: kube-system # The namespace where your Gateway is located
  hostnames:
  - "harbor.nscubed.lan"
  rules:
  - backendRefs:
    - name: harbor # The name of your service
      port: 80 # The port your service is listening on
